<nav class="sidebar-container" [class.collapsed]="layoutState.isSidebarCollapsed()">
  
  <!-- Área de Identidad Visual con Logo SVG Real -->
  <div class="brand">
    <div class="logo-placeholder">
      <img src="/NodesiteLogo.svg" alt="NODESITE Logo" class="logo-svg">
    </div>
    <h2 class="brand-text">NODESITE</h2>
  </div>

  <!-- Contenedor de Navegación Dinámica -->
  <div class="menu-scroll-container">
    <ul class="menu-list">
      @for (section of menuStructure; track section.category) {
        
        @if (section.category && !layoutState.isSidebarCollapsed()) {
          <li class="menu-category">{{ section.category }}</li>
        }

        @for (item of section.items; track item.title) {
          <li class="menu-item" [class.disabled-link]="!item.route">
            <a [routerLink]="item.route ? item.route : null" 
               [routerLinkActive]="item.route ? 'active' : ''"
               [matTooltip]="layoutState.isSidebarCollapsed() ? item.title : ''"
               matTooltipPosition="right"
               class="menu-link">
              
              <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
              <span class="menu-text">{{ item.title }}</span>
              
            </a>
          </li>
        }
      }
    </ul>
  </div>
</nav>
