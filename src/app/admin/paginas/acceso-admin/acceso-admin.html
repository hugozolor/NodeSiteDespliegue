<div class="admin-layout">
  <div class="login-container">
    <div class="login-card">
      <header class="card-header">
        <h1 class="logo-text"><span class="node">NODE</span><span class="site">site</span></h1>
        <p class="badge">PANEL ADMINISTRATIVO</p>
      </header>

      <form (ngSubmit)="onLoginAdmin()" #loginForm="ngForm">
        <div class="input-group">
          <label for="email">Correo Institucional</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="loginData.email" 
            placeholder="admin@nodesite.com" 
            required>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="clave" 
            [(ngModel)]="loginData.clave" 
            placeholder="••••••••" 
            required>
        </div>

        <p class="error-msg" *ngIf="error">{{ error }}</p>

        <button type="submit" class="btn-admin" [disabled]="!loginForm.valid || cargando">
          {{ cargando ? 'Verificando...' : 'Ingresar al Panel' }}
        </button>
      </form>
    </div>
  </div>
</div>
