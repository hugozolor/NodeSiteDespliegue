<header class="main-header">
  <div class="nav-container">
    <button class="menu-trigger" (click)="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <div class="app-brand">
      <img src="NodesiteLogo.svg" alt="Logo NODEsite" class="brand-logo-img">
      <h1>Node<span>site</span></h1>
    </div>

    <button class="profile-trigger" (click)="toggleUserMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
      </svg>
    </button>
  </div>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <img src="NodesiteLogo.svg" alt="Logo" class="sidebar-logo-img">
      <div class="sidebar-title">NODESITE</div>
    </div>
    
    <nav class="sidebar-content">
      <a *ngFor="let opt of menuOptions" class="nav-item" (click)="navegar(opt.label)">
        <svg class="icon-2d" viewBox="0 0 24 24" fill="currentColor">
          <path [attr.d]="opt.icon"></path>
        </svg>
        <span class="nav-item-label">{{ opt.label }}</span>
        
        <span class="badge-dot" *ngIf="opt.label === 'Notificación' && ((notificationService.unreadCount$ | async) ?? 0) > 0">
          {{ notificationService.unreadCount$ | async }}
        </span>
      </a>
    </nav>
  </aside>

  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <div class="guest-overlay-header" *ngIf="showGuestBlock">
    <app-guest-block (close)="cerrarBloqueo()"></app-guest-block>
  </div>

  <div class="user-dropdown" *ngIf="isUserMenuOpen && !sessionService.isGuest()">
    <div class="dropdown-header">
      <div class="info-row">
        <svg class="icon-2d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span class="text-bold">{{ userData.username }}</span>
      </div>
      <div class="info-row email">
        <svg class="icon-2d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span>{{ userData.email }}</span>
      </div>
    </div>

    <div class="chances-badge-inline">
        <svg class="heart-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="counter">Publicaciones: <strong>{{ limitService.chancesActuales() }}/5</strong></span>
    </div>
    
    <div class="dropdown-actions">
      <button class="action-btn" (click)="themeService.toggleTheme()">
        <svg *ngIf="!themeService.isDarkMode()" class="icon-2d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        <svg *ngIf="themeService.isDarkMode()" class="icon-2d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
        <span>{{ themeService.isDarkMode() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
      </button>
      <button class="action-btn exit" (click)="router.navigate(['/'])">
        <svg class="icon-2d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14l5-5-5-5m5 5H9"></path></svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</header>
