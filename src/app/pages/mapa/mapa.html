<app-header></app-header>

<div class="map-viewport">
  <div id="map-container"></div> 

  @if ((reporteService.pasoActual$ | async) === 'MAPA') {
    <app-mapa-ubicacion 
      (onConfirmar)="finalizarTodo()" 
      (onCancelar)="cancelarSeleccion()">
    </app-mapa-ubicacion>
  }

  <button class="fab-filter" (click)="toggleFiltro()">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
    </svg>
  </button>

  <div class="filter-side-panel" [class.show]="filtroVisible">
    
    <div class="panel-header">
      <div class="header-text">
        <h3>Filtrar Reportes</h3>
        <p>Selecciona una categoría para visualizar reportes específicos.</p>
      </div>
      <button class="close-btn" (click)="toggleFiltro()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="panel-body">
      <button class="filter-chip" 
              [class.active]="categoriaSeleccionada === 'Todas'"
              (click)="seleccionarCategoria('Todas')">
        Ver Todas
      </button>

      @for (cat of categorias; track cat.id) {
        <button class="filter-chip" 
                [class.active]="categoriaSeleccionada === cat.nombre"
                (click)="seleccionarCategoria(cat.nombre)">
          {{ cat.nombre }}
        </button>
      }
    </div>

    <div class="panel-footer">
      <h4>Acciones rápidas</h4>
      <div class="action-buttons-container">
        <button class="action-btn outline-btn" (click)="navigateTo('resenas')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 14v-2.47l6.88-6.88c.2-.2.51-.2.71 0l1.77 1.77c.2.2.2.51 0 .71L8.47 14H6zm12 0h-7.5l2-2H18v2z"/></svg>
          Reseñar
        </button>

        <button class="action-btn primary-btn" (click)="navigateTo('publicar')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm4 8h-3v3h-2v-3H8V8h3V5h2v3h3v2z"/></svg>
          Publicar
        </button>
      </div>
    </div>

  </div>
</div>
