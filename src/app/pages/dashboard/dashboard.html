<app-header></app-header>

<div class="main-viewport">
  <main class="dashboard-content">
    
    <section class="carousel-container" *ngIf="listaNoticias.length > 0">
      <div class="carousel-track" [style.transform]="'translateX(-' + (currentSlide * 100) + '%)'">
        <div class="slide" *ngFor="let noticia of listaNoticias">
          <div class="slide-card" [ngClass]="noticia.tipo">
            <span class="slide-badge">{{ noticia.tipo | uppercase }}</span>
            <h2 class="noticia-titulo">{{ noticia.titulo }}</h2>
            <p class="noticia-desc">{{ noticia.contenido }}</p>
          </div>
        </div>
      </div>

      <button class="carousel-control prev" (click)="prevSlide()">&#10094;</button>
      <button class="carousel-control next" (click)="nextSlide()">&#10095;</button>
    </section>

    <div class="welcome-section">
      <h1 class="welcome-title">¡Te damos la Bienvenida a Nodesite!</h1>
      <p class="discover-text">¡Descubrí lo que podés hacer!</p>
    </div>

    <section class="options-container">
      <div class="anses-card" *ngFor="let item of menuOptions" (click)="navegar(item.label)">
        <div class="card-icon-box">
          <mat-icon class="material-symbols-outlined custom-icon">
            {{ item.iconName }}
          </mat-icon>
        </div>
        <div class="card-info">
          <h3>{{ item.label }}</h3>
          <p>{{ item.desc }}</p>
        </div>
      </div>
    </section>
  </main>
</div>

<app-nav-bottom></app-nav-bottom>
