<div class="register-layout">
  
  <header class="brand-header">
    <h1 class="logo-text">
      <span class="node">Node</span><span class="site">site</span>
    </h1>
  </header>

  <main class="register-card">
    
    <div class="card-header fade-in">
      <h2>Registrarse</h2>
      <p>Unite a la comunidad para acceder a todos los beneficios.</p>
    </div>

    <form (ngSubmit)="onRegister()" class="register-form">
      
      <div class="input-group fade-in-delay-1">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="registerData.email"
          placeholder="nombre@ejemplo.com" 
          required
        >
      </div>

      <div class="input-group fade-in-delay-2">
        <label for="username">Ingresar nombre de usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          [(ngModel)]="registerData.username"
          placeholder="UsuarioUnico" 
          required
        >
        <span class="helper-text">Este nombre será público en la app.</span>
      </div>

      <div class="action-area fade-in-delay-3">
        <button type="submit" class="btn-submit">
          Continuar
        </button>
      </div>

    </form>
  </main>
</div>
